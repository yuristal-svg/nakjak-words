<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>나크작 X 박완서의 낱말들</title>
<meta name="description" content="박완서의 문장에서 건져 올린 오늘의 낱말, 그리고 우리가 덧붙이는 글">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{
    --page:#FFFBF6;
    --apricot:#FADBC6;
    --apricot-deep:#F2C3A4;
    --ink:#141210;
    --ink-soft:#5b524b;
    --line:#EADFD5;
    --card:#ffffff;
    --accent:#B5562A;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--page);
    color:var(--ink);
    font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;
    -webkit-font-smoothing:antialiased;
    line-height:1.6;
  }
  button,input,textarea{font-family:inherit;font-size:inherit;color:inherit}

  /* 상단 바 */
  header.top{
    position:sticky;top:0;z-index:20;
    background:rgba(255,251,246,.92);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
  }
  .top-inner{
    max-width:600px;margin:0 auto;padding:14px 16px;
    display:flex;align-items:center;justify-content:space-between;gap:12px;
  }
  .brand{
    font-family:"Nanum Myeongjo",serif;font-weight:800;
    font-size:18px;letter-spacing:-.02em;white-space:nowrap;
    cursor:pointer;
  }
  .brand .x{font-weight:400;color:var(--accent);margin:0 .25em}
  .admin-btn{
    border:1px solid var(--line);background:transparent;border-radius:999px;
    padding:6px 12px;font-size:13px;color:var(--ink-soft);cursor:pointer;white-space:nowrap;
  }
  .admin-btn.on{background:var(--ink);color:#fff;border-color:var(--ink)}

  main{max-width:600px;margin:0 auto;padding:20px 16px 80px}

  /* 관리자 패널 */
  .admin-panel{
    display:none;background:#fff;border:1.5px solid var(--ink);border-radius:16px;
    padding:20px;margin-bottom:28px;
  }
  .admin-panel.show{display:block}
  .admin-panel h2{
    font-family:"Nanum Myeongjo",serif;font-weight:800;font-size:18px;margin:0 0 4px;
  }
  .admin-panel .hint{font-size:13px;color:var(--ink-soft);margin:0 0 16px}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:13px;font-weight:600;margin-bottom:5px}
  .field label span{font-weight:400;color:var(--ink-soft)}
  .field input,.field textarea{
    width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;
    background:var(--page);outline:none;
  }
  .field input:focus,.field textarea:focus{border-color:var(--ink)}
  .field textarea{resize:vertical;min-height:70px;line-height:1.6}
  .word-input{font-family:"Nanum Myeongjo",serif !important;font-weight:800;font-size:22px !important}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .btn{
    border:none;border-radius:10px;padding:10px 18px;font-weight:600;cursor:pointer;
    background:var(--ink);color:#fff;
  }
  .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
  .btn:disabled{opacity:.5;cursor:default}

  /* 피드 카드 */
  .post{
    background:var(--card);border:1px solid var(--line);border-radius:18px;
    overflow:hidden;margin-bottom:36px;
    box-shadow:0 1px 0 rgba(0,0,0,.02);
  }
  .post-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 16px;
  }
  .post-date{font-size:14px;font-weight:600;letter-spacing:-.01em}
  .post-date small{font-weight:400;color:var(--ink-soft);margin-left:4px}
  .post-tools{display:none;gap:6px}
  body.is-admin .post-tools{display:flex}
  .tool{border:none;background:none;color:var(--ink-soft);font-size:13px;cursor:pointer;padding:4px 6px}
  .tool:hover{color:var(--ink)}

  .word-stage{
    background:var(--apricot);
    aspect-ratio:1/1;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:32px 24px;text-align:center;position:relative;
  }
  .word-stage .big{
    font-family:"Nanum Myeongjo",serif;font-weight:800;color:var(--ink);
    font-size:clamp(54px,15vw,96px);line-height:1.15;letter-spacing:-.03em;
    word-break:keep-all;
  }
  .word-stage .big.long{font-size:clamp(40px,10vw,68px)}
  .word-stage .tag{
    position:absolute;bottom:18px;left:0;right:0;
    font-family:"Nanum Myeongjo",serif;font-size:12px;letter-spacing:.2em;color:rgba(20,18,16,.55);
  }

  .post-body{padding:18px 18px 4px}
  .meaning{
    font-size:14.5px;color:var(--ink);margin:0 0 14px;
    padding-left:12px;border-left:2px solid var(--apricot-deep);
  }
  .meaning b{font-family:"Nanum Myeongjo",serif;font-weight:800;margin-right:6px}
  .quote{
    font-family:"Gowun Batang",serif;font-size:16px;line-height:1.85;
    margin:0 0 6px;white-space:pre-wrap;word-break:keep-all;
  }
  .quote mark{background:linear-gradient(transparent 58%,var(--apricot) 58%);color:inherit;padding:0 1px}
  .source{font-size:13px;color:var(--ink-soft);margin:0 0 14px}

  /* 댓글 */
  .comments{border-top:1px solid var(--line);margin-top:10px;padding:14px 18px 6px}
  .c-count{font-size:13px;color:var(--ink-soft);margin-bottom:8px}
  .c-item{padding:12px 0;border-bottom:1px dashed var(--line)}
  .c-item:last-child{border-bottom:none}
  .c-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .c-name{font-weight:700;font-size:14px}
  .c-time{font-size:12px;color:var(--ink-soft);margin-left:6px;font-weight:400}
  .c-actions{display:flex;gap:2px;flex-shrink:0}
  .c-text{
    font-family:"Gowun Batang",serif;font-size:15.5px;line-height:1.8;
    white-space:pre-wrap;word-break:break-word;margin-top:4px;
  }
  .c-edit textarea{
    width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:6px;
    background:var(--page);min-height:80px;resize:vertical;outline:none;line-height:1.7;
  }
  .c-edit .row{margin-top:6px;justify-content:flex-end}
  .c-edit .btn{padding:7px 14px;font-size:14px}
  .more-c{border:none;background:none;color:var(--ink-soft);font-size:13px;cursor:pointer;padding:6px 0}

  .c-foot{display:flex;align-items:center;gap:14px;margin-top:6px}
  .like,.reply-btn{
    border:none;background:none;cursor:pointer;padding:4px 0;font-size:13px;color:var(--ink-soft);
    display:inline-flex;align-items:center;gap:4px;
  }
  .like .heart{font-size:17px;line-height:1;transition:transform .15s}
  .like.on{color:var(--accent)}
  .like.on .heart{transform:scale(1.12)}
  .like:hover,.reply-btn:hover{color:var(--ink)}
  .like.on:hover{color:var(--accent)}
  .replies{margin:8px 0 2px 6px;padding-left:14px;border-left:2px solid var(--apricot)}
  .r-item{padding:8px 0}
  .r-item .c-name{font-size:13.5px}
  .r-item .c-text{font-size:15px}
  .r-form{padding:8px 0 4px}
  .r-form .who{display:flex;gap:6px;margin-bottom:6px}
  .r-form input{flex:1;min-width:0;border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:#fff;outline:none;font-size:14px}
  .r-form textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:#fff;outline:none;min-height:64px;resize:vertical;line-height:1.7;font-family:"Gowun Batang",serif;font-size:15px}
  .r-form input:focus,.r-form textarea:focus{border-color:var(--ink)}
  .r-form .row{justify-content:flex-end;margin-top:6px}
  .r-form .btn{padding:7px 14px;font-size:14px}
  .c-form{border-top:1px solid var(--line);padding:14px 18px 18px;background:#FFFDFB}
  .c-form .who{display:flex;gap:8px;margin-bottom:8px}
  .c-form input{
    flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:9px 11px;
    background:#fff;outline:none;font-size:14px;
  }
  .c-form textarea{
    width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;
    background:#fff;outline:none;min-height:84px;resize:vertical;line-height:1.7;
    font-family:"Gowun Batang",serif;font-size:15px;
  }
  .c-form input:focus,.c-form textarea:focus{border-color:var(--ink)}
  .c-form .row{justify-content:space-between;margin-top:8px}
  .c-form .note{font-size:12px;color:var(--ink-soft)}

  .empty{
    text-align:center;padding:80px 20px;color:var(--ink-soft);
    font-family:"Nanum Myeongjo",serif;font-size:17px;line-height:1.9;
  }
  .loading{text-align:center;padding:60px 0;color:var(--ink-soft);font-size:14px}
  .err{color:#b3261e;font-size:13px;margin-top:6px}

  /* 모달 */
  .modal-bg{
    position:fixed;inset:0;background:rgba(20,18,16,.45);z-index:50;
    display:none;align-items:center;justify-content:center;padding:16px;
  }
  .modal-bg.show{display:flex}
  .modal{
    background:#fff;border-radius:16px;padding:22px;width:100%;max-width:340px;
  }
  .modal h3{margin:0 0 6px;font-family:"Nanum Myeongjo",serif;font-weight:800;font-size:18px}
  .modal p{margin:0 0 14px;font-size:14px;color:var(--ink-soft)}
  .modal input{
    width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;
    font-size:16px;outline:none;letter-spacing:.1em;
  }
  .modal input:focus{border-color:var(--ink)}
  .modal .row{justify-content:flex-end;margin-top:14px}

  .toast{
    position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;
    opacity:0;transition:.25s;z-index:60;pointer-events:none;white-space:nowrap;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  footer{text-align:center;font-size:12px;color:var(--ink-soft);padding:0 16px 40px;font-family:"Nanum Myeongjo",serif}

  /* 탭 */
  .tabs{max-width:600px;margin:0 auto;padding:0 16px;display:flex;gap:22px}
  .tabs a{
    text-decoration:none;color:var(--ink-soft);font-size:14px;font-weight:600;
    padding:2px 0 10px;border-bottom:2px solid transparent;
  }
  .tabs a.on{color:var(--ink);border-bottom-color:var(--ink)}

  /* 갤러리 */
  #gallery{display:none}
  body.v-gallery #gallery{display:block}
  body.v-gallery #feed, body.v-gallery #adminPanel{display:none !important}
  .g-head{margin:6px 0 20px}
  .g-head h1{font-family:"Nanum Myeongjo",serif;font-weight:800;font-size:24px;margin:0 0 4px;letter-spacing:-.02em}
  .g-head p{margin:0;font-size:14px;color:var(--ink-soft)}
  .g-search{
    width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;
    background:#fff;outline:none;margin-bottom:16px;font-size:15px;
  }
  .g-search:focus{border-color:var(--ink)}
  .g-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .g-card{
    display:block;text-decoration:none;color:var(--ink);
    background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;
    transition:transform .15s, border-color .15s;
  }
  .g-card:hover{transform:translateY(-2px);border-color:var(--apricot-deep)}
  .g-card .g-top{
    background:var(--apricot);padding:22px 12px;text-align:center;
    font-family:"Nanum Myeongjo",serif;font-weight:800;font-size:22px;
    word-break:keep-all;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .g-card .g-meta{padding:10px 12px;font-size:12.5px;color:var(--ink-soft);line-height:1.5}
  .g-card .g-meta b{color:var(--ink);font-weight:700}

  .w-back{display:inline-block;font-size:14px;color:var(--ink-soft);text-decoration:none;margin-bottom:14px}
  .w-back:hover{color:var(--ink)}
  .w-banner{
    background:var(--apricot);border-radius:18px;padding:30px 20px;text-align:center;margin-bottom:14px;
  }
  .w-banner .w-name{font-family:"Nanum Myeongjo",serif;font-weight:800;font-size:clamp(30px,8vw,44px);letter-spacing:-.03em;word-break:keep-all}
  .w-banner .w-sub{font-family:"Nanum Myeongjo",serif;font-size:13px;letter-spacing:.15em;color:rgba(20,18,16,.6);margin-top:4px}
  .w-stats{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:22px;flex-wrap:wrap}
  .w-stats span{font-size:14px;color:var(--ink-soft)}
  .w-entry{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
  .w-entry .w-date{font-size:13px;color:var(--ink-soft);margin-bottom:6px}
  .w-entry .w-word{
    display:inline-block;background:var(--apricot);border-radius:6px;padding:2px 10px;
    font-family:"Nanum Myeongjo",serif;font-weight:800;font-size:18px;margin-bottom:10px;
  }
  .w-entry .c-text{margin-top:0}
  .w-meta{display:flex;gap:12px;font-size:13px;color:var(--ink-soft);margin-top:10px}
  .w-like{color:var(--accent)}

  @media (max-width:420px){
    .brand{font-size:16px}
    .c-form .who,.r-form .who{flex-direction:column}
  }
</style>
</head>
<body>

<header class="top">
  <div class="top-inner">
    <div class="brand" id="brand">나크작<span class="x">X</span>박완서의 낱말들</div>
    <button class="admin-btn" id="adminBtn">관리자</button>
  </div>
  <nav class="tabs">
    <a href="#/" id="tabFeed">오늘의 낱말</a>
    <a href="#/gallery" id="tabGallery">갤러리</a>
  </nav>
</header>

<main>
  <!-- 관리자: 오늘의 낱말 올리기 -->
  <section class="admin-panel" id="adminPanel">
    <h2 id="formTitle">오늘의 낱말 올리기</h2>
    <p class="hint">낱말만 넣어도 올라가요. 원문 문장과 뜻풀이는 있으면 채워 주세요.</p>
    <div class="field">
      <label for="fDate">날짜</label>
      <input type="date" id="fDate">
    </div>
    <div class="field">
      <label for="fWord">낱말</label>
      <input type="text" id="fWord" class="word-input" placeholder="예) 시나브로" maxlength="30">
    </div>
    <div class="field">
      <label for="fMeaning">뜻풀이 <span>(사전 뜻, 선택)</span></label>
      <textarea id="fMeaning" placeholder="국어사전의 뜻을 적어 주세요"></textarea>
    </div>
    <div class="field">
      <label for="fQuote">원문 문장 <span>(선택 · 낱말은 자동으로 표시돼요)</span></label>
      <textarea id="fQuote" placeholder="박완서 작품 속 문장"></textarea>
    </div>
    <div class="field">
      <label for="fSource">출처 <span>(선택)</span></label>
      <input type="text" id="fSource" placeholder="예) 『그 많던 싱아는 누가 다 먹었을까』">
    </div>
    <div class="row">
      <button class="btn" id="saveWord">올리기</button>
      <button class="btn ghost" id="cancelEdit" style="display:none">수정 취소</button>
    </div>
    <div class="err" id="adminErr"></div>
  </section>

  <div id="feed"><div class="loading">불러오는 중…</div></div>
  <div id="gallery"><div class="loading">불러오는 중…</div></div>
</main>

<footer>나크작 X 박완서의 낱말들</footer>

<!-- 비밀번호 모달 -->
<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h3 id="mTitle">비밀번호</h3>
    <p id="mDesc"></p>
    <input type="password" id="mInput" inputmode="numeric" autocomplete="off">
    <div class="err" id="mErr"></div>
    <div class="row">
      <button class="btn ghost" id="mCancel">취소</button>
      <button class="btn" id="mOk">확인</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ===================== 설정 ===================== */
// 공유 저장소: Firebase Realtime Database (젓가락 앱과 같은 didimdol 프로젝트, 다른 칸 사용)
const DB_URL = 'https://didimdol-1d4f3-default-rtdb.firebaseio.com';
const ROOT = 'nakjak_words';       // 이 사이트 전용 칸
const ADMIN_PW = '0909';           // 관리자 비밀번호
const COMMENTS_PREVIEW = 5;        // 낱말마다 처음에 보여줄 글 수

/* ===================== 도우미 ===================== */
const $ = id => document.getElementById(id);
const api = path => `${DB_URL}/${ROOT}/${path}.json`;
async function dbGet(path){ const r = await fetch(api(path)); if(!r.ok) throw new Error(r.status); return r.json(); }
async function dbPost(path,data){ const r = await fetch(api(path),{method:'POST',body:JSON.stringify(data)}); if(!r.ok) throw new Error(r.status); return r.json(); }
async function dbPatch(path,data){ const r = await fetch(api(path),{method:'PATCH',body:JSON.stringify(data)}); if(!r.ok) throw new Error(r.status); return r.json(); }
async function dbPut(path,data){ const r = await fetch(api(path),{method:'PUT',body:JSON.stringify(data)}); if(!r.ok) throw new Error(r.status); return r.json(); }
async function dbDel(path){ const r = await fetch(api(path),{method:'DELETE'}); if(!r.ok) throw new Error(r.status); }

function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
async function hash(s){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('nakjak:'+s));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
}
function todayStr(){
  const d = new Date(); const z = n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`;
}
function fmtDate(ds){
  const [y,m,d] = ds.split('-').map(Number);
  const w = ['일','월','화','수','목','금','토'][new Date(y,m-1,d).getDay()];
  return {main:`${y}년 ${m}월 ${d}일`, day:`${w}요일`};
}
function fmtTime(ts){
  const diff = (Date.now()-ts)/1000;
  if(diff<60) return '방금';
  if(diff<3600) return Math.floor(diff/60)+'분 전';
  if(diff<86400) return Math.floor(diff/3600)+'시간 전';
  const d = new Date(ts);
  return `${d.getMonth()+1}월 ${d.getDate()}일`;
}
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),1800); }

function askPassword(title, desc){
  return new Promise(resolve=>{
    $('mTitle').textContent = title; $('mDesc').textContent = desc||'';
    $('mInput').value=''; $('mErr').textContent='';
    $('modalBg').classList.add('show'); setTimeout(()=>$('mInput').focus(),50);
    const done = v=>{ $('modalBg').classList.remove('show'); $('mOk').onclick=$('mCancel').onclick=$('mInput').onkeydown=null; resolve(v); };
    $('mOk').onclick = ()=>done($('mInput').value);
    $('mCancel').onclick = ()=>done(null);
    $('mInput').onkeydown = e=>{ if(e.key==='Enter') done($('mInput').value); if(e.key==='Escape') done(null); };
  });
}

/* ===================== 상태 ===================== */
let words = {};      // {id:{date,word,meaning,quote,source,createdAt}}
let comments = {};   // {wordId:{cid:{name,text,pw,createdAt,editedAt}}}
let expanded = {};   // 글 더보기 펼친 낱말
let editingWordId = null;
let isAdmin = false;
try{ isAdmin = sessionStorage.getItem('nakjak_admin')==='1'; }catch(e){}

/* ===================== 불러오기 ===================== */
async function load(silent){
  try{
    const [w,c] = await Promise.all([dbGet('words'), dbGet('comments')]);
    words = w||{}; comments = c||{};
    const ae = document.activeElement;
    if(silent && ae && (ae.tagName==='INPUT'||ae.tagName==='TEXTAREA')) return;
    render();
  }catch(e){
    if(!silent) $('feed').innerHTML = '<div class="empty">불러오지 못했어요.<br>잠시 뒤 새로고침해 주세요.</div>';
  }
}

/* ===================== 화면 나누기 ===================== */
function route(){
  const h = location.hash.replace(/^#\/?/,'');
  if(h.startsWith('gallery')){
    const rest = h.slice('gallery'.length).replace(/^\//,'');
    return {view:'gallery', name: rest ? decodeURIComponent(rest) : null};
  }
  return {view:'feed'};
}
function render(){
  const r = route();
  document.body.classList.toggle('v-gallery', r.view==='gallery');
  $('tabFeed').classList.toggle('on', r.view==='feed');
  $('tabGallery').classList.toggle('on', r.view==='gallery');
  if(r.view==='gallery') r.name ? renderWall(r.name) : renderGallery();
  else renderFeed();
}
window.addEventListener('hashchange', ()=>{ render(); window.scrollTo(0,0); });

/* ===================== 갤러리 ===================== */
// 이름별로 모든 글 모으기
function collectAuthors(){
  const map = {};
  for(const [wid, cs] of Object.entries(comments)){
    const w = words[wid]; if(!w) continue;
    for(const [cid, c] of Object.entries(cs||{})){
      const name = (c.name||'').trim(); if(!name) continue;
      (map[name] = map[name] || []).push({cid, wid, word:w, c});
    }
  }
  for(const list of Object.values(map)){
    list.sort((a,b)=> a.word.date.localeCompare(b.word.date) || a.c.createdAt-b.c.createdAt);
  }
  return map;
}
const wallLink = name => '#/gallery/' + encodeURIComponent(name);

let gQuery = '';
function renderGallery(){
  const authors = collectAuthors();
  let names = Object.keys(authors).sort((a,b)=>a.localeCompare(b,'ko'));
  const total = names.length;
  if(gQuery) names = names.filter(n=>n.includes(gQuery));

  const cards = names.map(n=>{
    const list = authors[n];
    const days = new Set(list.map(x=>x.wid)).size;
    const last = fmtDate(list[list.length-1].word.date);
    return `<a class="g-card" href="${wallLink(n)}">
      <div class="g-top">${esc(n)}</div>
      <div class="g-meta"><b>글 ${list.length}편</b> · 낱말 ${days}개<br>최근 ${last.main.replace(/^\d+년 /,'')}</div>
    </a>`;
  }).join('');

  $('gallery').innerHTML = `
    <div class="g-head">
      <h1>갤러리</h1>
      <p>쓴 사람마다 담벼락이 생겨요. 지금까지 ${total}명이 글을 남겼어요.</p>
    </div>
    ${total ? `<input class="g-search" id="gSearch" placeholder="내 이름 찾기" value="${esc(gQuery)}">` : ''}
    ${total ? (names.length ? `<div class="g-grid">${cards}</div>` : '<div class="empty">그 이름의 담벼락이 없어요.</div>')
            : '<div class="empty">아직 담벼락이 없어요.<br>낱말 아래 글을 남기면 여기 생겨요.</div>'}`;

  const s = $('gSearch');
  if(s){
    s.oninput = ()=>{ gQuery = s.value.trim(); const pos=s.selectionStart; renderGallery(); const n=$('gSearch'); n.focus(); n.setSelectionRange(pos,pos); };
  }
}

function renderWall(name){
  const list = collectAuthors()[name] || [];
  if(!list.length){
    $('gallery').innerHTML = `<a class="w-back" href="#/gallery">← 갤러리</a>
      <div class="empty">‘${esc(name)}’ 님의 글이 아직 없어요.</div>`;
    return;
  }
  const days = new Set(list.map(x=>x.wid)).size;
  $('gallery').innerHTML = `
    <a class="w-back" href="#/gallery">← 갤러리</a>
    <div class="w-banner">
      <div class="w-name">${esc(name)}</div>
      <div class="w-sub">의 담벼락</div>
    </div>
    <div class="w-stats">
      <span>글 ${list.length}편 · 낱말 ${days}개</span>
      <button class="btn" id="dlTxt">txt로 내려받기</button>
    </div>
    ${list.map(x=>{
      const d = fmtDate(x.word.date);
      return `<div class="w-entry">
        <div class="w-date">${d.main} ${d.day}</div>
        <div class="w-word">${esc(x.word.word)}</div>
        <div class="c-text">${esc(x.c.text)}</div>
        ${wallMeta(x.c)}
      </div>`;
    }).join('')}`;
  $('dlTxt').onclick = ()=>downloadTxt(name, list);
}

function wallMeta(c){
  const l = Object.keys(c.likes||{}).length;
  return l ? `<div class="w-meta"><span class="w-like">♥&#xFE0E; ${l}</span></div>` : '';
}

function downloadTxt(name, list){
  const line = '─'.repeat(24);
  const t = fmtDate(todayStr());
  let out = `나크작 X 박완서의 낱말들\n${name}의 담벼락\n\n글 ${list.length}편 · ${t.main} 내려받음\n\n${'═'.repeat(24)}\n\n`;
  for(const x of list){
    const d = fmtDate(x.word.date);
    out += `${d.main} ${d.day}\n오늘의 낱말 · ${x.word.word}\n`;
    if(x.word.quote) out += `\n“${x.word.quote}”${x.word.source?`\n— 박완서, ${x.word.source}`:''}\n`;
    out += `\n${x.c.text}\n`;
    const l = Object.keys(x.c.likes||{}).length;
    if(l) out += `\n♥ ${l}\n`;
    out += `\n${line}\n\n`;
  }
  const blob = new Blob(['﻿'+out], {type:'text/plain;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `나크작_${name.replace(/[\\/:*?"<>|]/g,'_')}_담벼락.txt`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
  toast('내려받았어요');
}

/* ===================== 피드 그리기 ===================== */
function renderFeed(){
  // 쓰는 중인 글은 지켜두기
  const drafts = {};
  document.querySelectorAll('.c-form textarea').forEach(t=>{ if(t.value) drafts[t.dataset.w]=t.value; });
  const rDrafts = {};
  document.querySelectorAll('.r-form').forEach(f=>{ const t=f.elements.text; rDrafts[t.dataset.r]={text:t.value,name:f.elements.name.value,pw:f.elements.pw.value}; });
  const editing = document.querySelector('.c-edit');
  if(editing) return; // 수정 중엔 새로 그리지 않음

  const list = Object.entries(words).sort((a,b)=>
    b[1].date.localeCompare(a[1].date) || (b[1].createdAt||0)-(a[1].createdAt||0));

  if(!list.length){
    $('feed').innerHTML = '<div class="empty">아직 올라온 낱말이 없어요.<br>곧 첫 낱말이 도착합니다.</div>';
    return;
  }
  $('feed').innerHTML = list.map(([id,w])=>postHTML(id,w)).join('');
  Object.entries(drafts).forEach(([wid,v])=>{ const t=document.querySelector(`.c-form textarea[data-w="${wid}"]`); if(t) t.value=v; });

  let savedName=''; try{ savedName = localStorage.getItem('nakjak_name')||''; }catch(e){}
  Object.entries(rDrafts).forEach(([cid,d])=>{ const t=document.querySelector(`textarea[data-r="${cid}"]`); if(t){ const f=t.closest('form'); t.value=d.text; f.elements.name.value=d.name; f.elements.pw.value=d.pw; } });
  document.querySelectorAll('.c-form input[name=name], .r-form input[name=name]').forEach(i=>{ if(!i.value) i.value=savedName; });
}

function highlight(quote, word){
  const q = esc(quote);
  if(!word) return q;
  const w = esc(word);
  return q.split(w).join(`<mark>${w}</mark>`);
}

function postHTML(id,w){
  const d = fmtDate(w.date);
  const cs = Object.entries(comments[id]||{}).sort((a,b)=>a[1].createdAt-b[1].createdAt);
  const showAll = expanded[id] || cs.length<=COMMENTS_PREVIEW;
  const visible = showAll ? cs : cs.slice(-COMMENTS_PREVIEW);
  const hidden = cs.length - visible.length;

  return `
  <article class="post" id="p-${id}">
    <div class="post-head">
      <div class="post-date">${d.main}<small>${d.day}</small></div>
      <div class="post-tools">
        <button class="tool" onclick="editWord('${id}')">수정</button>
        <button class="tool" onclick="deleteWord('${id}')">삭제</button>
      </div>
    </div>
    <div class="word-stage">
      <div class="big ${[...w.word].length>5?'long':''}">${esc(w.word)}</div>
      <div class="tag">오늘의 낱말</div>
    </div>
    ${(w.meaning||w.quote)?`<div class="post-body">
      ${w.meaning?`<p class="meaning"><b>${esc(w.word)}</b>${esc(w.meaning)}</p>`:''}
      ${w.quote?`<p class="quote">${highlight(w.quote,w.word)}</p>`:''}
      ${w.source?`<p class="source">— 박완서, ${esc(w.source)}</p>`:''}
    </div>`:''}
    <div class="comments">
      <div class="c-count">${cs.length?`글 ${cs.length}편`:'아직 아무도 글을 달지 않았어요. 첫 글을 남겨 주세요.'}</div>
      ${hidden?`<button class="more-c" onclick="expanded['${id}']=true;render()">이전 글 ${hidden}편 더 보기</button>`:''}
      ${visible.map(([cid,c])=>commentHTML(id,cid,c)).join('')}
    </div>
    <form class="c-form" onsubmit="addComment(event,'${id}')">
      <div class="who">
        <input name="name" placeholder="이름" maxlength="20" required>
        <input name="pw" type="password" placeholder="비밀번호 (수정·삭제용)" maxlength="20" required autocomplete="new-password">
      </div>
      <textarea name="text" data-w="${id}" placeholder="‘${esc(w.word)}’(으)로 떠오르는 글을 남겨 주세요" maxlength="3000" required></textarea>
      <div class="row">
        <span class="note">비밀번호는 내 글을 고칠 때 써요</span>
        <button class="btn" type="submit">글 남기기</button>
      </div>
    </form>
  </article>`;
}

/* ===================== 좋아요·답글 도우미 ===================== */
// 이 기기(브라우저) 표시 — 좋아요를 한 번만 누르게
let DEVICE = '';
try{ DEVICE = localStorage.getItem('nakjak_device') || ''; }catch(e){}
if(!DEVICE){
  DEVICE = 'd' + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
  try{ localStorage.setItem('nakjak_device', DEVICE); }catch(e){}
}
let openReply = {};   // 답글 쓰기 칸이 열린 글
let openReplies = {}; // 답글 목록 펼친 글

// path: "wid/cid" 또는 "wid/cid/replies/rid"
function getNode(path){
  return path.split('/').reduce((o,k)=>o&&o[k], comments);
}
const idOf = path => path.split('/').pop();

function likeBtn(path,node){
  const likes = node.likes||{}; const n = Object.keys(likes).length; const mine = !!likes[DEVICE];
  return `<button class="like ${mine?'on':''}" onclick="toggleLike('${path}')" aria-label="좋아요">
    <span class="heart">${mine?'♥\uFE0E':'♡\uFE0E'}</span>${n?`<span>${n}</span>`:''}</button>`;
}

function nameLink(name){
  return `<a href="${wallLink((name||'').trim())}" style="color:inherit;text-decoration:none">${esc(name)}</a>`;
}

function commentHTML(wid,cid,c){
  const path = `${wid}/${cid}`;
  const rs = Object.entries(c.replies||{}).sort((a,b)=>a[1].createdAt-b[1].createdAt);
  const showRs = openReplies[cid] || rs.length<=2;
  const visibleRs = showRs ? rs : rs.slice(-2);
  const hiddenRs = rs.length - visibleRs.length;
  return `
  <div class="c-item" id="c-${cid}">
    <div class="c-top">
      <div class="c-name">${nameLink(c.name)}<span class="c-time">${fmtTime(c.createdAt)}${c.editedAt?' · 수정됨':''}</span></div>
      <div class="c-actions">
        <button class="tool" onclick="editNode('${path}')">수정</button>
        <button class="tool" onclick="deleteNode('${path}')">삭제</button>
      </div>
    </div>
    <div class="c-text">${esc(c.text)}</div>
    <div class="c-foot">
      ${likeBtn(path,c)}
      <button class="reply-btn" onclick="toggleReplyForm('${cid}')">답글${rs.length?` ${rs.length}`:' 달기'}</button>
    </div>
    ${rs.length||openReply[cid] ? `<div class="replies">
      ${hiddenRs?`<button class="more-c" onclick="openReplies['${cid}']=true;render()">이전 답글 ${hiddenRs}개 더 보기</button>`:''}
      ${visibleRs.map(([rid,r])=>replyHTML(wid,cid,rid,r)).join('')}
      ${openReply[cid] ? replyFormHTML(wid,cid,c.name) : ''}
    </div>` : ''}
  </div>`;
}

function replyHTML(wid,cid,rid,r){
  const path = `${wid}/${cid}/replies/${rid}`;
  return `
  <div class="r-item" id="c-${rid}">
    <div class="c-top">
      <div class="c-name">${nameLink(r.name)}<span class="c-time">${fmtTime(r.createdAt)}${r.editedAt?' · 수정됨':''}</span></div>
      <div class="c-actions">
        <button class="tool" onclick="editNode('${path}')">수정</button>
        <button class="tool" onclick="deleteNode('${path}')">삭제</button>
      </div>
    </div>
    <div class="c-text">${esc(r.text)}</div>
    <div class="c-foot">${likeBtn(path,r)}</div>
  </div>`;
}

function replyFormHTML(wid,cid,toName){
  return `
  <form class="r-form" onsubmit="addReply(event,'${wid}','${cid}')">
    <div class="who">
      <input name="name" placeholder="이름" maxlength="20" required>
      <input name="pw" type="password" placeholder="비밀번호" maxlength="20" required autocomplete="new-password">
    </div>
    <textarea name="text" data-r="${cid}" placeholder="${esc(toName)} 님에게 답글" maxlength="1500" required></textarea>
    <div class="row">
      <button class="btn ghost" type="button" onclick="toggleReplyForm('${cid}')">취소</button>
      <button class="btn" type="submit">답글 남기기</button>
    </div>
  </form>`;
}

function toggleReplyForm(cid){
  openReply[cid] = !openReply[cid];
  if(openReply[cid]) openReplies[cid] = true;
  render();
  if(openReply[cid]){
    const t = document.querySelector(`textarea[data-r="${cid}"]`);
    if(t){ const f=t.closest('form'); (f.elements.name.value ? t : f.elements.name).focus(); }
  }
}

async function toggleLike(path){
  const node = getNode(path); if(!node) return;
  node.likes = node.likes||{};
  const mine = !!node.likes[DEVICE];
  if(mine) delete node.likes[DEVICE]; else node.likes[DEVICE] = true;
  render();
  try{
    if(mine) await dbDel(`comments/${path}/likes/${DEVICE}`);
    else await dbPut(`comments/${path}/likes/${DEVICE}`, true);
  }catch(e){
    if(mine) node.likes[DEVICE] = true; else delete node.likes[DEVICE];
    render(); toast('좋아요가 반영되지 않았어요');
  }
}

/* ===================== 글(댓글)·답글 ===================== */
async function addComment(e,wid){
  e.preventDefault();
  const f = e.target, btn = f.querySelector('button[type=submit]');
  const el = f.elements; const name = el.name.value.trim(), pw = el.pw.value, text = el.text.value.trim();
  if(!name||!pw||!text) return;
  btn.disabled = true;
  try{
    const data = {name, text, pw: await hash(pw), createdAt: Date.now()};
    const res = await dbPost(`comments/${wid}`, data);
    comments[wid] = comments[wid]||{};
    comments[wid][res.name] = data;
    try{ localStorage.setItem('nakjak_name', name); }catch(_){}
    el.text.value=''; el.pw.value='';
    expanded[wid]=true;
    render();
    toast('글을 남겼어요');
  }catch(err){ toast('저장에 실패했어요. 다시 시도해 주세요'); }
  btn.disabled = false;
}

async function addReply(e,wid,cid){
  e.preventDefault();
  const f = e.target, btn = f.querySelector('button[type=submit]');
  const el = f.elements; const name = el.name.value.trim(), pw = el.pw.value, text = el.text.value.trim();
  if(!name||!pw||!text) return;
  btn.disabled = true;
  try{
    const data = {name, text, pw: await hash(pw), createdAt: Date.now()};
    const res = await dbPost(`comments/${wid}/${cid}/replies`, data);
    const c = comments[wid][cid]; c.replies = c.replies||{}; c.replies[res.name] = data;
    try{ localStorage.setItem('nakjak_name', name); }catch(_){}
    el.text.value='';
    openReply[cid] = false; openReplies[cid] = true;
    render(); toast('답글을 남겼어요');
  }catch(err){ btn.disabled = false; toast('저장에 실패했어요. 다시 시도해 주세요'); }
}

async function checkPw(path,action){
  if(isAdmin) return true;
  const pw = await askPassword(`${action}`, '글을 남길 때 정한 비밀번호를 넣어 주세요.');
  if(pw===null) return false;
  if(await hash(pw) !== getNode(path).pw){ toast('비밀번호가 맞지 않아요'); return false; }
  return true;
}

async function editNode(path){
  if(!await checkPw(path,'글 수정')) return;
  const box = $('c-'+idOf(path)); const node = getNode(path);
  box.querySelector(':scope > .c-text').outerHTML = `
    <div class="c-edit">
      <textarea>${esc(node.text)}</textarea>
      <div class="row">
        <button class="btn ghost" onclick="cancelCommentEdit()">취소</button>
        <button class="btn" onclick="saveNode('${path}',this)">저장</button>
      </div>
    </div>`;
  box.querySelector(':scope > .c-top .c-actions').style.display='none';
  box.querySelector('.c-edit textarea').focus();
}
function cancelCommentEdit(){ document.querySelector('.c-edit')?.remove(); render(); }

async function saveNode(path,btn){
  const text = btn.closest('.c-edit').querySelector('textarea').value.trim();
  if(!text) return;
  btn.disabled = true;
  try{
    const patch = {text, editedAt: Date.now()};
    await dbPatch(`comments/${path}`, patch);
    Object.assign(getNode(path), patch);
    document.querySelector('.c-edit')?.remove();
    render(); toast('고쳤어요');
  }catch(e){ btn.disabled=false; toast('저장에 실패했어요'); }
}

async function deleteNode(path){
  const isReply = path.includes('/replies/');
  if(!await checkPw(path, isReply?'답글 삭제':'글 삭제')) return;
  const n = isReply ? 0 : Object.keys(getNode(path).replies||{}).length;
  if(!confirm(`이 ${isReply?'답글':'글'}을 지울까요? 되돌릴 수 없어요.${n?`\n달린 답글 ${n}개도 함께 지워져요.`:''}`)) return;
  try{
    await dbDel(`comments/${path}`);
    const parts = path.split('/'); const key = parts.pop();
    delete getNode(parts.join('/'))[key];
    render(); toast('지웠어요');
  }catch(e){ toast('삭제에 실패했어요'); }
}

/* ===================== 관리자 ===================== */
function setAdmin(on){
  isAdmin = on;
  document.body.classList.toggle('is-admin', on);
  $('adminPanel').classList.toggle('show', on);
  $('adminBtn').classList.toggle('on', on);
  $('adminBtn').textContent = on ? '관리자 나가기' : '관리자';
  try{ on ? sessionStorage.setItem('nakjak_admin','1') : sessionStorage.removeItem('nakjak_admin'); }catch(e){}
  if(!on) resetForm();
}

$('adminBtn').onclick = async ()=>{
  if(isAdmin){ setAdmin(false); return; }
  const pw = await askPassword('관리자', '관리자 비밀번호를 넣어 주세요.');
  if(pw===null) return;
  if(pw===ADMIN_PW){ if(route().view!=='feed') location.hash='#/'; setAdmin(true); window.scrollTo({top:0,behavior:'smooth'}); setTimeout(()=>$('fWord').focus(),300); }
  else toast('비밀번호가 맞지 않아요');
};

function resetForm(){
  editingWordId = null;
  $('fDate').value = todayStr();
  ['fWord','fMeaning','fQuote','fSource'].forEach(i=>$(i).value='');
  $('formTitle').textContent = '오늘의 낱말 올리기';
  $('saveWord').textContent = '올리기';
  $('cancelEdit').style.display = 'none';
  $('adminErr').textContent = '';
}
$('cancelEdit').onclick = resetForm;

$('saveWord').onclick = async ()=>{
  const data = {
    date: $('fDate').value || todayStr(),
    word: $('fWord').value.trim(),
    meaning: $('fMeaning').value.trim(),
    quote: $('fQuote').value.trim(),
    source: $('fSource').value.trim(),
  };
  if(!data.word){ $('adminErr').textContent='낱말을 넣어 주세요.'; return; }
  $('saveWord').disabled = true; $('adminErr').textContent='';
  try{
    if(editingWordId){
      await dbPatch(`words/${editingWordId}`, data);
      Object.assign(words[editingWordId], data);
      toast('고쳤어요');
    }else{
      data.createdAt = Date.now();
      const res = await dbPost('words', data);
      words[res.name] = data;
      toast('오늘의 낱말을 올렸어요');
    }
    resetForm(); render();
  }catch(e){ $('adminErr').textContent='저장에 실패했어요. 인터넷 연결을 확인해 주세요.'; }
  $('saveWord').disabled = false;
};

function editWord(id){
  const w = words[id]; editingWordId = id;
  $('fDate').value=w.date; $('fWord').value=w.word; $('fMeaning').value=w.meaning||'';
  $('fQuote').value=w.quote||''; $('fSource').value=w.source||'';
  $('formTitle').textContent = '낱말 고치기';
  $('saveWord').textContent = '고친 내용 저장';
  $('cancelEdit').style.display = '';
  window.scrollTo({top:0,behavior:'smooth'});
}

async function deleteWord(id){
  const n = Object.keys(comments[id]||{}).length;
  if(!confirm(`‘${words[id].word}’ 낱말을 지울까요?${n?`\n달린 글 ${n}편도 함께 지워져요.`:''}`)) return;
  try{
    await Promise.all([dbDel(`words/${id}`), dbDel(`comments/${id}`)]);
    delete words[id]; delete comments[id];
    render(); toast('지웠어요');
  }catch(e){ toast('삭제에 실패했어요'); }
}

/* ===================== 시작 ===================== */
$('brand').onclick = ()=>{ if(route().view!=='feed') location.hash='#/'; else window.scrollTo({top:0,behavior:'smooth'}); };
resetForm();
setAdmin(isAdmin);
load();
setInterval(()=>{ if(!document.hidden) load(true); }, 30000);  // 30초마다 새 글 확인
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) load(true); });
</script>
